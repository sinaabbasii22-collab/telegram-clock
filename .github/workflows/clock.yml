name: Telegram Clock

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Restore Telegram session and config
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_B64: ${{ secrets.SESSION_B64 }}
        run: |
          printf '%s' "$SESSION_B64" | base64 -d > session.session

          python - <<'PY'
          import json, os

          config = {
              "api_id": int(os.environ["API_ID"]),
              "api_hash": os.environ["API_HASH"],
              "timezone": "Asia/Tehran",
              "update_mode": "both",
              "interval": 60,
              "bio_template": "",
              "name_template": "ꜱɪɴᴀ {time}",
              "use_emoji": False,
              "safe_mode": True
          }

          with open("config.json", "w") as f:
              json.dump(config, f)
          PY

      - name: Run Telegram Clock
        run: timeout 210s python main.py || true
ls -l .github/workflows/clock.yml
